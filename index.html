<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>MSA 641 Peer Evaluation</title>
<style>
  :root {
    --navy: #0b2a4a;
    --accent: #1a5fd0;
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #4d5560;
    --line: #d9dee5;
    --edge: #8a94a0;
    --sel: #0b2a4a;
    --warn: #b42318;
    --ok: #1a7f37;
    --bar: #7a8491;
    --star: #b7791f;
    --btn: #ffffff;
    --sep: rgba(0,0,0,.10);
    --t1: #eaf2ff; --t2: #e9f7ee; --t3: #fff3e2; --t4: #f2ecff; --t5: #e5f6f7; --t6: #ffecf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #1a2027; --text: #e8ebef; --muted: #a9b2bd;
      --line: #2f3843; --edge: #5a6573; --sel: #2f6fd6; --accent: #6ea2ff; --bar: #6b7684; --star: #f0b429;
      --warn: #ff7b72; --ok: #3fb950;
      --btn: #11161b; --sep: rgba(255,255,255,.10);
      --t1: #172233; --t2: #15261d; --t3: #2a2216; --t4: #211b31; --t5: #13272a; --t6: #2c1920;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 21px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  body.lock { position: fixed; left: 0; right: 0; overflow: hidden; }
  button { cursor: pointer; }
  button:active { filter: brightness(.92); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px 40px;
    padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
  h2 { font-size: 26px; margin: 22px 2px 10px; }
  .note { color: var(--muted); font-size: 20px; margin: 8px 2px 14px; }

  .bar { position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff;
    padding: 8px 12px 0; padding-top: calc(8px + env(safe-area-inset-top)); }
  .bar .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; }
  .bar .t { flex: 1; min-width: 0; }
  .bar .t b { display: block; font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { display: flex; gap: 6px; margin-top: 6px; }
  .dots button { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: transparent;
    color: #fff; font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1; }
  .dots button.on { background: #fff; border-color: #fff; color: var(--navy); }
  .bar .score { text-align: right; flex: none; }
  .bar .score b { font-size: 28px; }
  .bar .score span { display: block; font-size: 16px; opacity: .9; }
  .prog { height: 5px; background: rgba(255,255,255,.2); margin: 0 -12px; }
  .prog i { display: block; height: 100%; width: 0; background: #7fb3ff; transition: width .2s; }

  .crit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 14px 10px; margin: 18px 0; scroll-margin-top: 110px; }
  .crit.c1 { background: var(--t1); } .crit.c2 { background: var(--t2); } .crit.c3 { background: var(--t3); }
  .crit.c4 { background: var(--t4); } .crit.c5 { background: var(--t5); } .crit.c6 { background: var(--t6); }
  .crit.tint { border-color: transparent; }
  .crit h3 { font-size: 28px; margin: 0 0 2px; line-height: 1.2; }
  .crit .w { font-size: 19px; color: var(--muted); margin-bottom: 10px; }
  .crit .cs { display: block; font-size: 20px; font-weight: 700; color: var(--accent); }
  .item { padding: 12px 0 10px; border-top: 1px solid var(--sep); scroll-margin-top: 110px; }
  .item .q { font-size: 26px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
  .item.missing { border-left: 5px solid var(--warn); padding-left: 10px; }
  .item.missing .q { color: var(--warn); }
  .item.missing .q::after { content: " (needs an answer)"; font-weight: 400; font-size: 20px; }
  .hint { font-size: 19px; color: var(--muted); margin: 0 0 7px; font-style: italic; }
  .cap { font-size: 19px; color: var(--accent); font-weight: 600; min-height: 24px; margin-top: 6px; }
  .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .scale button, .yesno button, .list button { border: 2px solid var(--edge); background: var(--btn); color: var(--text); font: inherit; }
  .scale button { border-radius: 12px; min-height: 64px; padding: 0; }
  .scale button b { font-size: 30px; line-height: 1; }
  .scale.grade button b { font-size: 32px; }
  .scale button.on, .yesno button.on, .list button.on { background: var(--sel); border-color: var(--sel); color: #fff; }
  .stars { display: flex; gap: 4px; }
  .stars button { flex: 1; min-width: 0; border: none; background: none; font-size: clamp(40px, 13.5vw, 54px); line-height: 1; padding: 4px 0;
    color: var(--bar); font-family: inherit; }
  .stars button.on { color: var(--star); }
  .bars { display: flex; gap: 10px; align-items: flex-end; height: 90px; }
  .bars button { flex: 1; height: 100%; border: none; background: none; padding: 0; display: flex; align-items: flex-end; }
  .bars button i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: var(--bar); }
  .bars button.on i { background: var(--sel); }
  .list { display: grid; gap: 5px; }
  .list button { text-align: left; border-radius: 12px; padding: 8px 14px; font-size: 22px; min-height: 52px; }
  .list button.on { font-weight: 400; }
  .yesno { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .yesno button { border-radius: 12px; font-size: 25px; font-weight: 700; min-height: 64px; }
  .addc { background: none; border: none; color: var(--accent); font: inherit; font-size: 21px; padding: 10px 0; }
  textarea { width: 100%; min-height: 96px; border: 2px solid var(--edge); border-radius: 12px; padding: 10px;
    font: inherit; font-size: 21px; background: var(--btn); color: var(--text); resize: vertical; margin: 4px 0 10px; }
  .opt { font-weight: 400; color: var(--muted); font-size: 20px; }
  .submit { display: block; width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 14px;
    padding: 20px; font: inherit; font-size: 24px; font-weight: 700; margin-top: 18px; }
  .submit:disabled { opacity: .6; }
  .err { color: var(--warn); font-size: 20px; margin: 10px 2px; min-height: 1em; }
  .hidden { display: none !important; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 600px; border-radius: 18px;
    padding: 20px 16px; max-height: 90vh; max-height: 90dvh; overflow: auto; }
  .sheet h3 { margin: 0 0 8px; font-size: 26px; }
  .sheet p { margin: 0 0 10px; color: var(--muted); font-size: 20px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  .btn2 { border-radius: 12px; padding: 14px; font: inherit; font-weight: 700; border: 2px solid var(--edge); background: var(--btn); color: var(--text); }
  .btn2.pri { background: var(--accent); border-color: var(--accent); color: #fff; }

  .thanks { text-align: center; padding: 40px 10px; }
  .thanks .big { font-size: clamp(40px, 13vw, 54px); font-weight: 800; color: var(--accent); white-space: nowrap; }
  #s-form.busy #crits, #s-form.busy textarea { pointer-events: none; opacity: .6; }
  .thanks h2 { margin-top: 6px; }
</style>
</head>
<body>

<section id="s-form">
  <div class="bar">
    <div class="inner">
      <div class="t"><b>Peer evaluation</b><div class="dots" id="dots" role="group" aria-label="Sections"></div></div>
      <div class="score"><b id="total">&ndash;</b><span>of 100</span></div>
    </div>
    <div class="prog"><i id="progbar"></i></div>
  </div>
  <div class="wrap">
    <div class="note" id="now2"></div>
    <div id="crits"></div>
    <div class="crit">
      <h3 id="h-overall">Overall comments <span class="opt">(optional)</span></h3>
      <textarea id="c-overall" aria-labelledby="h-overall" placeholder="What worked well? What could the team improve?"></textarea>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="submit" id="submit" type="button">Submit evaluation</button>
  </div>
</section>

<section id="s-done" class="hidden">
  <div class="wrap thanks">
    <div class="big" id="dscore"></div>
    <h2 id="h-done" tabindex="-1">Submitted. Thank you!</h2>
    <p class="note" id="davg"></p>
    <p class="note" id="dwhen"></p>
    <button class="submit" id="again" type="button">Evaluate another presentation</button>
  </div>
</section>

<div class="modal hidden" id="m-flat" role="dialog" aria-modal="true" aria-labelledby="h-flat">
  <div class="sheet">
    <h3 id="h-flat">Same answer throughout</h3>
    <p id="flatmsg"></p>
    <p>Please review your ratings, or give a one-sentence reason (at least 15 characters).</p>
    <textarea id="flatwhy" aria-label="Reason" placeholder="Reason"></textarea>
    <div class="err" id="flaterr" role="alert"></div>
    <div class="row2">
      <button class="btn2" id="flatreview" type="button">Review ratings</button>
      <button class="btn2 pri" id="flatok" type="button">Submit anyway</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAWVroYfVEm0C3ESjLahaiW6oNMDF9mqqL40JlNszsw5vRTlURuoVqiOjFPqE6av6F/exec";
const COURSE = "MSA 641";
const LAYOUT_VERSION = 6;
const DRAFT = "msa641_draft";

const CRITERIA = [
  { id: "c1", title: "Preparation & group organization", tag: "Team flow", w: 20, items: [
    ["c1a", "Content follows a logical, cohesive sequence"],
    ["c1b", "The team presents a clear, joint outline or agenda"],
    ["c1c", "Speaker transitions are smooth and seamless"],
    ["c1d", "The team shows evidence of shared preparation and planning"],
    ["c1e", "The team delivers one unified strategy, not disconnected parts"] ] },
  { id: "c2", title: "Quality of content & supply chain synthesis", tag: "Shared mastery", w: 20, items: [
    ["c2a", "The team shows deep collective knowledge of supply chain concepts"],
    ["c2b", "The team applies critical decision-making concepts accurately"],
    ["c2c", "The team integrates graduate-level research throughout"],
    ["c2d", "Both presenters show consistent command of the material"],
    ["c2e", "The team presents a unified thesis with no contradictions or gaps"] ] },
  { id: "c3", title: "Technique of presentation", tag: "Coordinated delivery", w: 20, items: [
    ["c3a", "The presenters make professional eye contact with the audience"],
    ["c3b", "The presenters speak with an energetic, forceful voice"],
    ["c3c", "The presenters deliver extemporaneously, without reading slides or notes"],
    ["c3d", "The presenters stay attentive and respectful toward each other"],
    ["c3e", "The team shows a positive, coordinated presence"] ] },
  { id: "c4", title: "PowerPoint visual aids & requirements", tag: "Cohesive design", w: 10, items: [
    ["c4a", "Slides are legible, professional and consistent in design"],
    ["c4b", "Slides illustrate the key concepts clearly"],
    ["c4c", "Slides include all required sections: intro, overview, issue brief and conclusions"],
    ["c4d", "The deck includes an APA-style reference slide"],
    ["c4e", "Images have attributions beneath them"] ] },
  { id: "c5", title: "Shared defense", tag: "Team Q&A", w: 10, items: [
    ["c5a", "The team handles Q&A and defends its work effectively"],
    ["c5b", "The presenters’ answers are cohesive and build on each other"],
    ["c5c", "Both presenters show shared ownership of the topic"],
    ["c5d", "Both presenters share the floor equitably"] ] },
  { id: "c6", title: "Overall group instructional effectiveness", tag: "Unified impact", w: 20, items: [
    ["c6a", "I clearly learned from this presentation"],
    ["c6b", "The delivery is engaging and cooperative"],
    ["c6c", "The message is powerful, unified and impactful"],
    ["c6d", "The team stays highly professional from start to finish"] ] }
];
const ALL_ITEMS = CRITERIA.flatMap(c => c.items.map(i => i[0]));

const LABELS = ["Very poor", "Needs improvement", "Fair", "Good", "Excellent"];
const GRADES = ["F", "D", "C", "B", "A"];
const AGREE = ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"];
const COVER = ["None", "A few", "About half", "Most", "All"];
const FREQ3 = [[5, "Usually"], [3, "Sometimes"], [1, "Rarely"]];
const BALANCE = ["One person did all the talking", "Mostly one person", "Somewhat uneven", "Nearly even", "Evenly shared"];
const STYLES = {
  num:     { hint: "1 = very poor, 5 = excellent" },
  rev:     { hint: "5 = excellent, 1 = very poor" },
  grade:   { hint: "Letter grade, F to A" },
  stars:   { hint: "Tap the stars: 5 stars = excellent" },
  bars:    { hint: "Tap a bar: the taller, the better" },
  agree:   { hint: "How much do you agree?" },
  words:   { hint: "Which label fits best?" },
  yesno:   { hint: "Yes or no" },
  yesall:  { hint: "Yes only if all four sections appear" },
  cover:   { hint: "How many images have an attribution?" },
  freq:    { hint: "How often?" },
  balance: { hint: "How evenly do they share the floor?" }
};
const ROTATE = ["num", "rev", "grade", "stars", "bars", "agree", "words"];
const FAMILY = { num: "n", rev: "n", yesall: "yesno" };
const fam = t => FAMILY[t] || t;
const FIXED = { c3a: "freq", c3c: "freq", c3d: "freq", c4c: "yesall", c4d: "yesno", c4e: "cover", c5d: "balance", c6a: "agree" };
const NO_AGREE = ["c2a", "c2c", "c6c", "c6d"];
const ROT_ITEMS = ALL_ITEMS.filter(k => !FIXED[k]);

let sending = false, sentSub = null, firstAt = null, lastAt = null, ratings = {}, comments = {}, startedAt = null, orderLog = {}, flatReason = "", attnVal = null, layout = null;

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function readCookie(n) { const m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; }
let device = store.get("msa641_device") || readCookie("msa641_device");
if (!device) device = Math.random().toString(36).slice(2) + Date.now().toString(36);
store.set("msa641_device", device);
try { document.cookie = "msa641_device=" + encodeURIComponent(device) + "; max-age=31536000; path=/; SameSite=Lax"; } catch (e) {}

async function hashStr(t) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).slice(0, 8).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return "f" + h.toString(16);
  }
}
function canvasSig() {
  try {
    const c = document.createElement("canvas"); c.width = 240; c.height = 60; const x = c.getContext("2d");
    x.textBaseline = "top"; x.font = "16px Arial"; x.fillStyle = "#f60"; x.fillRect(100, 1, 62, 20);
    x.fillStyle = "#069"; x.fillText("MSA641 \u00e9\u00df\u2603", 2, 15); x.fillStyle = "rgba(102,204,0,.7)"; x.fillText("MSA641 \u00e9\u00df\u2603", 4, 17);
    return c.toDataURL();
  } catch (e) { return ""; }
}
function webglInfo() {
  try {
    const g = document.createElement("canvas").getContext("webgl"); if (!g) return {};
    const d = g.getExtension("WEBGL_debug_renderer_info");
    return { glVendor: d ? g.getParameter(d.UNMASKED_VENDOR_WEBGL) : g.getParameter(g.VENDOR),
      glRenderer: d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER) };
  } catch (e) { return {}; }
}
async function collectFp() {
  const n = navigator, s = screen || {}, mq = q => { try { return matchMedia(q).matches; } catch (e) { return null; } };
  const fp = {
    ua: n.userAgent || "", platform: n.platform || "", vendor: n.vendor || "",
    lang: n.language || "", langs: (n.languages || []).join(","),
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""), tzOffset: new Date().getTimezoneOffset(),
    screen: s.width + "x" + s.height, avail: s.availWidth + "x" + s.availHeight, dpr: window.devicePixelRatio || 1,
    colorDepth: s.colorDepth, viewport: window.innerWidth + "x" + window.innerHeight,
    cores: n.hardwareConcurrency || "", memory: n.deviceMemory || "", touch: n.maxTouchPoints || 0,
    cookies: n.cookieEnabled, dnt: n.doNotTrack || "", pdf: n.pdfViewerEnabled === undefined ? "" : n.pdfViewerEnabled,
    dark: mq("(prefers-color-scheme: dark)"), reducedMotion: mq("(prefers-reduced-motion: reduce)"),
    standalone: !!(n.standalone || mq("(display-mode: standalone)")),
    net: n.connection ? (n.connection.effectiveType || "") : ""
  };
  Object.assign(fp, webglInfo());
  try {
    if (n.userAgentData) {
      fp.uaMobile = n.userAgentData.mobile; fp.uaPlatform = n.userAgentData.platform;
      const h = await n.userAgentData.getHighEntropyValues(["model", "platformVersion", "architecture", "fullVersionList"]);
      fp.model = h.model || ""; fp.platformVersion = h.platformVersion || ""; fp.arch = h.architecture || "";
      fp.browsers = (h.fullVersionList || []).map(b => b.brand + " " + b.version).join("; ");
    }
  } catch (e) {}
  fp.canvas = await hashStr(canvasSig());
  const stable = ["ua", "platform", "lang", "langs", "tz", "screen", "dpr", "colorDepth", "cores", "memory", "touch",
    "glVendor", "glRenderer", "model", "platformVersion"].map(k => k + "=" + (fp[k] === undefined ? "" : fp[k])).join("|");
  fp.id = await hashStr(stable);
  return fp;
}
const fpReady = collectFp().catch(() => ({}));

function fmtNow(d) {
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function tick() { const s = fmtNow(new Date()); $("now2").textContent = "Rate the presentation you just watched · " + s; }
tick(); setInterval(tick, 15000);

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { ["s-form", "s-done"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0, 0); }
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function layoutValid(L) {
  if (!L || L.v !== LAYOUT_VERSION || !L.order || !L.types || !L.attn) return false;
  if (!ROTATE.includes(L.attn.type) || !ALL_ITEMS.every(k => STYLES[L.types[k]])) return false;
  return CRITERIA.every(c => {
    const a = (L.order[c.id] || []).slice().sort().join(","), b = c.items.map(i => i[0]).sort().join(",");
    return a === b;
  });
}

function openForm(fresh) {
  const draft = fresh ? null : store.get(DRAFT);
  const recent = draft && Date.now() - (draft.lastAt || draft.startedAt || 0) < 30 * 60 * 1000;
  const ok = recent && layoutValid(draft.layout);
  ratings = {}; attnVal = null; sending = false;
  if (ok) {
    Object.keys(draft.ratings || {}).forEach(k => { const v = Number(draft.ratings[k]);
      if (ALL_ITEMS.includes(k) && v >= 1 && v <= 5) ratings[k] = v; });
    attnVal = draft.attnVal || null;
  }
  comments = (ok && draft.comments) || {};
  startedAt = (ok && draft.startedAt) || Date.now();
  firstAt = (ok && draft.firstAt) || null; lastAt = (ok && draft.lastAt) || null; sentSub = (ok && draft.sentSub) || null;
  $("s-form").classList.remove("busy");
  layout = ok ? draft.layout : makeLayout();
  orderLog = {}; flatReason = "";
  $("err").textContent = "";
  renderForm();
  show("s-form");
  if (sentSub) { const sub = sentSub; serverLookup(sub).then(j => { if (j.found && sentSub === sub) openForm(true); }).catch(() => {}); }
  saveDraft();
}

function noSameFixedNeighbours(keys) {
  for (let i = 1; i < keys.length; i++) if (FIXED[keys[i]] && FIXED[keys[i - 1]] && fam(FIXED[keys[i]]) === fam(FIXED[keys[i - 1]])) return false;
  return true;
}

function makeLayout() {
  const order = {};
  CRITERIA.forEach(c => {
    let o = shuffle(c.items.map(i => i[0]));
    for (let t = 0; t < 2000 && !noSameFixedNeighbours(o); t++) o = shuffle(o);
    order[c.id] = o;
  });
  const types = {}; let bag = [], prev = null;
  CRITERIA.forEach(c => order[c.id].forEach((key, ix, arr) => {
    if (FIXED[key]) { types[key] = FIXED[key]; prev = FIXED[key]; return; }
    const nxt = FIXED[arr[ix + 1]] || "";
    const okFor = s => fam(s) !== fam(prev || "") && fam(s) !== fam(nxt) && !(s === "agree" && NO_AGREE.includes(key));
    let i = bag.findIndex(okFor);
    if (i < 0) { bag = bag.concat(shuffle(ROTATE)); i = bag.findIndex(okFor); }
    types[key] = bag.splice(i, 1)[0]; prev = types[key];
  }));
  const crit = CRITERIA[1 + Math.floor(Math.random() * 4)].id;
  const pos = 1 + Math.floor(Math.random() * 3);
  const near = [types[order[crit][pos - 1]], types[order[crit][pos]]].filter(Boolean).map(fam);
  const attn = { crit, pos, type: shuffle(ROTATE.filter(t => !near.includes(fam(t))))[0], target: Math.random() < .5 ? 2 : 4 };
  return { v: LAYOUT_VERSION, order, types, attn };
}

function labelFor(type, v) {
  return { num: "“" + v + "”", rev: "“" + v + "”", grade: "the letter “" + GRADES[v - 1] + "”",
    stars: v + (v === 1 ? " star" : " stars"), bars: "bar number " + v + " from the left",
    agree: "“" + AGREE[v - 1] + "”", words: "“" + LABELS[v - 1] + "”" }[type];
}

function buildWidget(type, qid, current, onPick) {
  const wrap = document.createElement("div");
  const hint = document.createElement("div"); hint.className = "hint"; hint.textContent = STYLES[type].hint;
  const box = document.createElement("div"); box.setAttribute("role", "radiogroup"); box.setAttribute("aria-labelledby", qid);
  const cap = document.createElement("div"); cap.className = "cap";
  wrap.append(hint, box, cap);
  const btns = [];
  const coded = ["num", "rev", "grade", "stars", "bars"].includes(type);
  const add = (v, html) => {
    const b = document.createElement("button"); b.type = "button";
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
    if (coded) b.setAttribute("aria-label", v + " of 5, " + LABELS[v - 1]);
    b.innerHTML = html; b.dataset.v = v; b.onclick = () => { paint(v); onPick(v); };
    box.appendChild(b); btns.push(b);
  };
  const up = [1, 2, 3, 4, 5], down = [5, 4, 3, 2, 1];
  if (type === "num") { box.className = "scale"; up.forEach(v => add(v, `<b>${v}</b>`)); }
  if (type === "rev") { box.className = "scale"; down.forEach(v => add(v, `<b>${v}</b>`)); }
  if (type === "grade") { box.className = "scale grade"; up.forEach(v => add(v, `<b>${GRADES[v - 1]}</b>`)); }
  if (type === "stars") { box.className = "stars"; up.forEach(v => add(v, "★")); }
  if (type === "bars") { box.className = "bars"; up.forEach(v => add(v, `<i style="height:${14 + v * 13}px"></i>`)); }
  if (type === "agree") { box.className = "list"; down.forEach(v => add(v, AGREE[v - 1])); }
  if (type === "words") { box.className = "list"; down.forEach(v => add(v, LABELS[v - 1])); }
  if (type === "yesno" || type === "yesall") { box.className = "yesno"; add(5, "Yes"); add(1, "No"); }
  if (type === "cover") { box.className = "list"; down.forEach(v => add(v, COVER[v - 1])); add(5, "No images used"); }
  if (type === "freq") { box.className = "list"; FREQ3.forEach(([v, t]) => add(v, t)); }
  if (type === "balance") { box.className = "list"; down.forEach(v => add(v, BALANCE[v - 1])); }
  const fills = type === "stars" || type === "bars";
  let picked = null;
  function paint(v, el) {
    btns.forEach((b, i) => {
      const bv = +b.dataset.v;
      const on = fills ? bv <= v : (el ? b === el : bv === v && (type !== "cover" || i === btns.findIndex(x => +x.dataset.v === v)));
      b.classList.toggle("on", on); b.setAttribute("aria-checked", (fills ? bv === v : on) ? "true" : "false");
    });
    cap.textContent = coded && v ? v + "/5 · " + LABELS[v - 1] : "";
  }
  if (type === "cover") {
    btns.forEach(b => b.onclick = () => { const v = +b.dataset.v; paint(v, b); onPick(v, b.textContent); });
    if (current) {
      const el = current.label ? btns.find(b => b.textContent === current.label) : null;
      paint(current.v, el || null);
    }
  } else if (current) paint(current.v);
  return wrap;
}

function renderForm() {
  const host = $("crits"); host.innerHTML = "";
  const textOf = {}; CRITERIA.forEach(c => c.items.forEach(([k, t]) => textOf[k] = t));
  CRITERIA.forEach((c, ci) => {
    const card = document.createElement("div"); card.className = "crit tint " + c.id; card.id = "card-" + c.id;
    card.innerHTML = `<h3>${ci + 1}. ${esc(c.title)}</h3><div class="w">${esc(c.tag)} · ${c.w} points</div><span class="cs" id="cs-${c.id}"></span>`;
    const keys = layout.order[c.id].slice(); orderLog[c.id] = keys.join(",");
    if (layout.attn.crit === c.id) keys.splice(Math.min(layout.attn.pos, keys.length), 0, "attn");
    keys.forEach(key => {
      const it = document.createElement("div"); it.className = "item"; it.id = "it-" + key;
      const isAttn = key === "attn";
      const type = isAttn ? layout.attn.type : layout.types[key];
      const q = document.createElement("div"); q.className = "q"; q.id = "q-" + key;
      q.textContent = isAttn ? "For this item, please choose " + labelFor(type, layout.attn.target) + "." : textOf[key];
      it.appendChild(q);
      const cur = isAttn ? (attnVal ? { v: attnVal } : null) : (ratings[key] ? { v: ratings[key], label: (comments._cover || {})[key] } : null);
      it.appendChild(buildWidget(type, "q-" + key, cur, (v, label) => {
        const wasNew = isAttn ? !attnVal : !ratings[key];
        if (isAttn) attnVal = v; else ratings[key] = v;
        if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
        if (label) comments._cover = Object.assign({}, comments._cover, { [key]: label });
        lastAt = Date.now(); if (!firstAt) firstAt = lastAt;
        it.classList.remove("missing"); saveDraft(); update();
        if (wasNew) setTimeout(() => goNext(it), 600);
      }));
      card.appendChild(it);
    });
    const add = document.createElement("button"); add.type = "button"; add.className = "addc";
    const ta = document.createElement("textarea"); ta.placeholder = "Optional comment on section " + (ci + 1);
    ta.setAttribute("aria-label", "Comment on " + c.title);
    ta.value = comments[c.id] || ""; ta.oninput = () => { comments[c.id] = ta.value; saveDraft(); };
    add.textContent = "+ Comment (optional)";
    add.onclick = () => { ta.classList.remove("hidden"); add.classList.add("hidden"); ta.focus(); };
    if (ta.value) add.classList.add("hidden"); else ta.classList.add("hidden");
    card.appendChild(add); card.appendChild(ta);
    host.appendChild(card);
  });
  $("c-overall").value = comments.overall || "";
  $("c-overall").oninput = e => { comments.overall = e.target.value; saveDraft(); };
  update();
}

function motion() { try { return matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"; } catch (e) { return "smooth"; } }
function goNext(from) {
  const all = Array.from(document.querySelectorAll("#crits .item"));
  const open = el => { const k = el.id.slice(3); return k === "attn" ? !attnVal : !ratings[k]; };
  const nx = all.slice(all.indexOf(from) + 1).find(open);
  if (nx) {
    if (nx.closest(".crit") !== from.closest(".crit")) return;
    const r = nx.getBoundingClientRect();
    if (r.top > 110 && r.bottom < innerHeight - 16) return;
    nx.scrollIntoView({ behavior: motion(), block: "center" });
  } else if (!all.some(open)) $("submit").scrollIntoView({ behavior: motion(), block: "center" });
}

function scores() {
  const per = {}; let total = 0, complete = true;
  CRITERIA.forEach(c => {
    const vals = c.items.map(i => ratings[i[0]]).filter(Boolean);
    if (vals.length < c.items.length) complete = false;
    const s = vals.length ? c.w * (vals.reduce((a, b) => a + (b - 1), 0) / vals.length) / 4 : null;
    per[c.id] = s; if (s != null) total += s;
  });
  return { per, total: Math.round(total * 10) / 10, complete };
}

function update() {
  const n = ALL_ITEMS.filter(k => ratings[k]).length + (attnVal ? 1 : 0), N = ALL_ITEMS.length + 1;
  const dots = $("dots");
  if (dots.children.length !== CRITERIA.length) {
    dots.innerHTML = "";
    CRITERIA.forEach((c, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = i + 1;
      b.onclick = () => $("card-" + c.id).scrollIntoView({ behavior: motion(), block: "start" }); dots.appendChild(b); });
  }
  CRITERIA.forEach((c, i) => {
    const fin = c.items.every(it => ratings[it[0]]) && (layout.attn.crit !== c.id || attnVal);
    const b = dots.children[i]; b.classList.toggle("on", !!fin);
    b.setAttribute("aria-label", "Section " + (i + 1) + (fin ? ", finished" : ", not finished"));
  });
  $("progbar").style.width = (100 * n / N) + "%";
  const s = scores();
  $("total").textContent = s.complete ? s.total.toFixed(1) : "–";
  CRITERIA.forEach(c => { const v = s.per[c.id];
    const done = c.items.every(i => ratings[i[0]]);
    $("cs-" + c.id).textContent = done ? v.toFixed(1) + " / " + c.w : ""; });
}

function saveDraft() { store.set(DRAFT, { ratings, comments, startedAt, firstAt, lastAt, attnVal, layout, sentSub }); }

function stats() {
  const v = ROT_ITEMS.map(k => ratings[k]);
  const mean = v.reduce((a, b) => a + b, 0) / v.length;
  const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length);
  const distinct = new Set(v).size;
  const flatCrit = CRITERIA.filter(c => {
    const r = c.items.map(i => i[0]).filter(k => !FIXED[k]);
    return r.length > 2 && new Set(r.map(k => ratings[k])).size === 1;
  }).length;
  return { sd: Math.round(sd * 1000) / 1000, distinct, flatCrit };
}

let lockY = 0;
function openModal() { lockY = window.scrollY; document.body.style.top = -lockY + "px"; document.body.classList.add("lock");
  $("m-flat").classList.remove("hidden"); setTimeout(() => $("flatwhy").focus(), 50); }
function closeModal() { $("m-flat").classList.add("hidden"); document.body.classList.remove("lock"); document.body.style.top = "";
  window.scrollTo(0, lockY); $("submit").focus(); }

$("submit").onclick = () => {
  const missing = ALL_ITEMS.filter(k => !ratings[k]).concat(attnVal ? [] : ["attn"]);
  if (missing.length) {
    missing.forEach(k => { const el = $("it-" + k); if (el) el.classList.add("missing"); });
    $("err").textContent = missing.length + (missing.length === 1 ? " question still needs" : " questions still need") + " an answer.";
    const first = document.querySelector(".item.missing"); if (first) first.scrollIntoView({ behavior: motion(), block: "center" });
    return;
  }
  const st = stats();
  if (st.distinct !== 1) flatReason = "";
  if (st.distinct === 1 && !flatReason) {
    $("flatmsg").textContent = "You gave the same answer (" + ratings[ROT_ITEMS[0]] + " out of 5) on all " + ROT_ITEMS.length + " scale questions.";
    $("flatwhy").value = ""; $("flatwhy").style.borderColor = ""; $("flaterr").textContent = ""; openModal();
    return;
  }
  send(st);
};
$("flatreview").onclick = () => { closeModal(); $("card-c1").scrollIntoView({ behavior: motion() }); };
$("flatok").onclick = () => {
  const r = $("flatwhy").value.trim();
  if (r.length < 15) { $("flatwhy").focus(); $("flatwhy").style.borderColor = "var(--warn)"; $("flaterr").textContent = "Please write at least 15 characters."; return; }
  flatReason = r; closeModal(); send(stats());
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("m-flat").classList.contains("hidden")) closeModal(); });

async function serverLookup(sub) {
  const r = await fetch(SCRIPT_URL + "?device=" + encodeURIComponent(device) + (sub ? "&sub=" + encodeURIComponent(sub) : ""), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j || !j.ok) throw new Error("bad reply");
  return j;
}

async function send(st) {
  const failMsg = "Could not send. Your answers are saved on this phone. Check your connection and tap Submit again.";
  if (sending) return;
  if (!navigator.onLine) { $("err").textContent = failMsg; return; }
  sending = true;
  const btn = $("submit"); btn.disabled = true; btn.textContent = "Submitting…"; $("err").textContent = "";
  $("s-form").classList.add("busy");
  const s = scores(); const now = new Date();
  const payload = {
    subId: device + "-" + startedAt,
    course: COURSE,
    localTime: now.toISOString(), localDisplay: fmtNow(now),
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || ""),
    ratings, comments: { c1: comments.c1 || "", c2: comments.c2 || "", c3: comments.c3 || "", c4: comments.c4 || "",
      c5: comments.c5 || "", c6: comments.c6 || "", overall: comments.overall || "" },
    attn: { target: layout.attn.target, value: attnVal, style: layout.attn.type },
    styles: ALL_ITEMS.map(k => k + ":" + layout.types[k] + ((comments._cover || {})[k] ? "(" + comments._cover[k] + ")" : "")).join(","),
    firstAt, lastAt, clientTotal: s.total, durationSec: Math.round((Date.now() - startedAt) / 1000),
    sd: st.sd, distinct: st.distinct, flatCriteria: st.flatCrit, flatReason, order: orderLog, device,
    fp: await Promise.race([fpReady, new Promise(r => setTimeout(() => r({}), 1500))])
  };
  sentSub = payload.subId; saveDraft();
  const post = async () => {
    const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    if (!r.ok) throw new TypeError("HTTP " + r.status);
    return r.json();
  };
  let avg = null;
  try {
    let ok = false;
    try {
      let j = await post();
      if (j && !j.ok && /lock/i.test(j.error || "")) { await new Promise(r => setTimeout(r, 2000)); j = await post(); }
      if (!j || !j.ok) { $("err").textContent = "Could not send: " + ((j && j.error) || "server error") + " Your answers are saved on this phone."; return; }
      ok = true; if (j.classN > 0) avg = j;
    } catch (e) {
      if (!(e instanceof TypeError)) throw e;
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      const j = await serverLookup(payload.subId);
      ok = j.found === true;
      if (!ok) throw new Error("not confirmed");
    }
    if (ok) {
      store.del(DRAFT);
      const ck = "msa641_count_" + now.toDateString(), n = (Number(store.get(ck)) || 0) + 1; store.set(ck, n);
      $("dscore").textContent = s.total.toFixed(1) + " / 100";
      $("davg").textContent = avg && avg.classN >= 3 ? "Class average for this presentation: " + Number(avg.classAvg).toFixed(1) + " / 100 (" + avg.classN + " ratings)" : "";
      $("dwhen").textContent = fmtNow(now) + " · Evaluation " + n + " from this phone today";
      show("s-done"); $("h-done").focus();
    }
  } catch (e) {
    $("err").textContent = failMsg;
  } finally { sending = false; $("s-form").classList.remove("busy"); btn.disabled = false; btn.textContent = "Submit evaluation"; }
}

["G1", "G2", "G3", "G4"].forEach(g => { store.del("msa641_draft_" + g); store.del("msa641_done_" + g); });
$("again").onclick = () => openForm(true);
openForm(false);
</script>
